# Keyboard HUD: file di configurazione d'esempio.
#
# Copialo accanto all'eseguibile con il nome "keyboard-hud.toml" (modalità
# portable) oppure nella cartella di configurazione dell'utente. Le modifiche
# vengono applicate entro un secondo, senza riavviare l'app.
# Tutte le voci sono facoltative: se mancano si usano i valori qui sotto.

[device]
# Usa solo la tastiera con questi ID (esadecimali). Se li ometti, l'HUD usa il
# primo dispositivo Raw HID (usage page 0xFF60) che risponde al protocollo HUD.
# vid = "0x4653"
# pid = "0x0004"

[appearance]
opacity = 0.85      # 0.2 – 1.0
scale = 1.0         # 0.5 – 2.0 (anche Ctrl + rotellina sull'HUD)
theme = "system"    # "system", "dark", "light"
mode = "full"       # "full" (tastiera completa) o "compact" (striscia piccola)
# Posizione iniziale in pixel logici. Di solito non serve: l'HUD ricorda
# l'ultima posizione in keyboard-hud-state.toml.
# x = 100
# y = 800
# Trascinando l'HUD vicino ai bordi o al centro dello schermo ci si aggancia
# (solo Windows). Distanza di aggancio in pixel logici, 0 = disattivato.
snap_distance = 16
# Spazio tra l'HUD e i bordi, per l'aggancio e per menu → Posizione.
screen_margin = 8

# Nomi e colori dei layer, nell'ordine del firmware (0, 1, 2, ...).
# color: "#RRGGBB", oppure "" per un layer neutro.
[[layers]]
name = "BASE"
color = ""

[[layers]]
name = "SYM"
color = "#00B9D7"   # azzurro

[[layers]]
name = "NAV"
color = "#3CC85A"   # verde

[[layers]]
name = "SYS"
color = ""          # neutro, come i LED

[[layers]]
name = "DEBUG"
color = "#E63C3C"   # rosso

[[layers]]
name = "ACC"
color = "#EBC828"   # giallo

[headsup]
# L'HUD resta nascosto e compare da solo quando: è attivo un layer diverso da
# BASE (anche solo tenendo Fn1/Fn2), è in attesa un one-shot, oppure un
# modificatore resta premuto a lungo. Con DEBUG bloccato resta visibile.
enabled = true
modifier_delay_ms = 400   # Ctrl/Shift/Alt/Gui tenuto almeno così a lungo
hide_delay_ms = 800       # scompare dopo questo tempo dal ritorno a BASE
hidden_opacity = 0.0      # 0 = invisibile, 0.15 = appena visibile

[stats]
# Solo contatori aggregati per tasto, layer e giorno: mai testo, sequenze o tempi.
enabled = true
file = ""                 # vuoto = keyboard-hud-stats.json accanto alla configurazione
unused_days = 30          # report: tasti mai usati negli ultimi N giorni

[backup]
# Backup automatico della configurazione della tastiera (keymap, macro, combo,
# tap dance, key override, impostazioni QMK) come file .vil, ricaricabile in
# Vial con File → Load saved layout. Si salva solo quando qualcosa è cambiato.
enabled = true
dir = ""                  # vuoto = cartella "backups" accanto alla configurazione
keep = 30                 # backup da tenere per tastiera; i più vecchi vengono cancellati

# Etichette personalizzate. Ogni voce vale per un keycode (eventualmente solo
# su un layer) oppure per una posizione precisa (layer + row + col, come
# nella matrice del firmware). La posizione vince sul keycode.
# Keycode: nomi QMK (KC_F10), forme brevi (S(KC_F5), C(KC_DOT), C(S(KC_F5))),
# tasti personalizzati (QK_KB_15 o USER15).

# Layer DEBUG (4): comandi di debug di VS Code, mano sinistra.
# riga alta
[[labels]]
layer = 4
keycode = "C(S(KC_F5))"
label = "Restart"
description = "Riavvia il debug (Ctrl+Shift+F5)"

[[labels]]
layer = 4
keycode = "QK_KB_15"      # SM_RUN
label = "Run"
description = "Esegui senza debug (Ctrl+F5)"

[[labels]]
layer = 4
keycode = "KC_F9"
label = "Breakpt"
description = "Attiva/disattiva breakpoint (F9)"

[[labels]]
layer = 4
keycode = "KC_F12"
label = "Go to def"
description = "Vai alla definizione (F12)"

# home row
[[labels]]
layer = 4
keycode = "S(KC_F5)"
label = "Stop"
description = "Ferma il debug (Shift+F5)"

[[labels]]
layer = 4
keycode = "KC_F5"
label = "Continue"
description = "Avvia/continua (F5)"

[[labels]]
layer = 4
keycode = "KC_F10"
label = "Step over"
description = "Esegui la riga (F10)"

[[labels]]
layer = 4
keycode = "KC_F11"
label = "Step into"
description = "Entra nella funzione (F11)"

[[labels]]
layer = 4
keycode = "S(KC_F11)"
label = "Step out"
description = "Esci dalla funzione (Shift+F11)"

# riga bassa
[[labels]]
layer = 4
keycode = "S(KC_F12)"
label = "Refs"
description = "Trova i riferimenti (Shift+F12)"

[[labels]]
layer = 4
keycode = "A(KC_F12)"
label = "Peek def"
description = "Anteprima della definizione (Alt+F12)"

[[labels]]
layer = 4
keycode = "KC_F2"
label = "Rename"
description = "Rinomina il simbolo (F2)"

[[labels]]
layer = 4
keycode = "C(KC_DOT)"
label = "Quick fix"
description = "Correzione rapida (Ctrl+.)"

# Esempio per posizione: il tasto in alto a sinistra del layer BASE.
# [[labels]]
# layer = 0
# row = 0
# col = 0
# label = "Debug"

# Etichette per applicazione: valgono solo con quel programma in primo piano
# e, a parità di tasto, vincono su quelle generiche. Il nome è quello del
# processo, senza ".exe" e senza distinguere maiuscole: "code" vale per
# Code.exe (Windows) e code (Linux); su macOS è il nome dell'app ("Code").
# Anche una lista: app = ["idea64", "pycharm64"]. Su Wayland l'applicazione in
# primo piano non si può sapere: valgono solo le etichette generiche.
# [[labels]]
# app = "code"
# layer = 4
# keycode = "KC_F10"
# label = "Step over"

[polling]
visible_hz = 60     # stato letto 60 volte al secondo con l'HUD visibile
hidden_hz = 10      # e 10 volte al secondo quando è nascosto
timeout_ms = 50     # attesa massima di ogni risposta

[log]
level = "info"      # "error", "warn", "info", "debug" (oppure --verbose)
