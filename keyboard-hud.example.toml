# Keyboard HUD: example configuration file.
#
# Copy it next to the executable as "keyboard-hud.toml" (portable mode) or to
# the user configuration folder. Changes apply within a second, without
# restarting the app.
# Every entry is optional: missing ones take the values below.
# It can also be edited from the Settings window (menu, tray or Ctrl+, on the
# HUD) and from the menu: the app rewrites only the entries you change, the
# comments stay.

[device]
# Only use the keyboard with these IDs (hexadecimal). Without them the HUD
# uses the first Raw HID device (usage page 0xFF60) that answers the HUD
# protocol.
# vid = "0x4653"
# pid = "0x0001"

[appearance]
opacity = 0.85      # 0.2 – 1.0
scale = 1.0         # 0.5 – 2.0 (also Ctrl + mouse wheel on the HUD)
theme = "system"    # "system", "dark", "light"
# Interface language: "auto" (the system one: Italian if it is Italian,
# English otherwise), "en" or "it". Also from the menu.
language = "auto"
mode = "full"       # "full" (whole keyboard) or "compact" (small strip)
# Initial position in logical pixels. Usually not needed: the HUD remembers
# the last position in keyboard-hud-state.toml.
# x = 100
# y = 800
# Dragging the HUD near the edges or the center of the screen snaps it there
# (Windows only). Snap distance in logical pixels, 0 = off.
snap_distance = 16
# Space between the HUD and the screen edges, for snapping and menu → Position.
screen_margin = 8
# Tray icon (notification area / menu bar) with show/hide, pause, backup,
# statistics, start with the system, quit. On Linux it uses D-Bus
# (StatusNotifierItem): KDE and most panels show it, GNOME needs the
# "AppIndicator" extension.
tray = true
# Style: colors and shape of keys and window. Built in: "default", "minimal",
# "glass", "high-contrast" and the themes listed in the README; more as .toml
# files in the styles/ folder next to this configuration. Empty = default.
style = ""
# Opacity and corner radius of the keys; when missing the style decides.
# key_opacity = 1.0   # 0.2 – 1.0: the legends stay solid
# key_radius = 0.12   # 0 (sharp corners) – 0.5 of the key size
# Combos configured in Vial drawn over the keys. Also from the menu.
combos = false
# With a full screen window in the foreground (game, video, presentation)
# the HUD and the mini indicator hide; the keycast stays. Windows and X11.
hide_in_fullscreen = true

# Names and colors of the layers, in firmware order (0, 1, 2, ...). Layers
# without an entry are called L4, L5...
# color: "#RRGGBB", or "" for a neutral layer.
[[layers]]
name = "BASE"
color = ""

[[layers]]
name = "LOWER"
color = "#00B9D7"   # cyan

[[layers]]
name = "RAISE"
color = "#3CC85A"   # green

[[layers]]
name = "ADJUST"
color = "#EBC828"   # yellow

[headsup]
# The HUD stays hidden and shows up on its own when: a layer other than the
# base one is on (even just holding Lower/Raise), a one-shot is waiting, or
# a modifier is held for a while. With a locked layer it stays visible.
enabled = true
layer_delay_ms = 250      # a layer must stay on at least this long:
                          # quick combinations do not bring the HUD up
modifier_delay_ms = 400   # Ctrl/Shift/Alt/Gui held at least this long
hide_delay_ms = 800       # hides this long after going back to the base layer
hidden_opacity = 0.0      # 0 = invisible, 0.15 = barely visible
# With the HUD hidden, a small keyboard stays where it shows up, with the
# keys of layers 1 and 2 in their colors. Light or dark depending on the
# background (Windows and X11). It sits on the side of the HUD nearest to the
# screen edges. Also from the menu.
marker = true
marker_opacity = 0.85     # 0.1 – 1.0
# A locked layer (TG, Layer Lock) keeps up the whole HUD ("hud") or only the
# mini indicator ("indicator").
locked_layer = "hud"
# The same for a waiting one-shot (OSL, one-shot mods): with "indicator" the
# HUD stays hidden and the badge shows the waiting layer or modifier.
oneshot = "hud"
# And for a modifier held longer than modifier_delay_ms: with "indicator" the
# badge only shows "Ctrl", "Shift"... instead of the whole HUD.
modifiers = "hud"

[indicator]
# Mini indicator: with the HUD hidden, a corner of the screen shows only the
# states that last after the keys are released: locked layers, waiting
# one-shots, locked modifiers, Caps Lock and Caps Word. It also tells why the
# keyboard is missing (not found, paused for Vial) and, for two seconds, what
# just changed: QWERTY/Colemak-DH, OS, HUD hidden by HUD_TOG.
enabled = true
# top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right
position = "top-right"

[keycast]
# For videos and presentations: shows the shortcuts you press on screen
# (Ctrl+C, Alt+Tab, F5...). Never the text, nothing is saved. Also from the menu.
enabled = false
position = "bottom"   # same values as [indicator]

[stats]
# Only aggregated counters per key, layer and day: never text, sequences or timings.
enabled = true
file = ""                 # empty = keyboard-hud-stats.json next to the configuration
unused_days = 30          # report: keys never used in the last N days

[backup]
# Automatic backup of the keyboard configuration (keymap, macros, combos,
# tap dances, key overrides, QMK settings) as a .vil file, which Vial loads
# with File → Load saved layout. Saved only when something changed.
enabled = true
dir = ""                  # empty = "backups" folder next to the configuration
keep = 30                 # backups to keep per keyboard; older ones are deleted

[update]
# Once a day, checks GitHub for a new version and tells you (in the footer
# and in the mini indicator). With false, only from menu → General or from
# the tray. Installing always starts from your click only: it downloads the
# file for your system, verifies the checksum, replaces the executable where
# it is and restarts. It only connects to github.com, with the system curl.
auto_check = true

# Custom labels. Each entry applies to a keycode (optionally on one layer
# only) or to an exact position (layer + row + col, as in the firmware
# matrix). The position wins over the keycode.
# Keycodes: QMK names (KC_F10), short forms (S(KC_F5), C(KC_DOT), C(S(KC_F5))),
# custom keys (QK_KB_15 or USER15).

# Example by keycode: F10 on layer 2.
# [[labels]]
# layer = 2
# keycode = "KC_F10"
# label = "Step over"
# description = "Step over (F10)"

# Example by position: the top left key of the base layer.
# [[labels]]
# layer = 0
# row = 0
# col = 0
# label = "Esc"

# Per-application labels: they apply only with that program in the
# foreground and, for the same key, win over the generic ones. The name is
# the process name, without ".exe" and case-insensitive: "code" matches
# Code.exe (Windows) and code (Linux); on macOS it is the app name ("Code").
# A list works too: app = ["idea64", "pycharm64"]. On Wayland the foreground
# application cannot be known: only the generic labels apply.
# [[labels]]
# app = "code"
# keycode = "KC_F5"
# label = "Continue"

[polling]
visible_hz = 60     # state read 60 times a second with the HUD visible
hidden_hz = 10      # and 10 times a second when hidden
timeout_ms = 50     # maximum wait for each answer

[log]
level = "info"      # "error", "warn", "info", "debug" (or --verbose)
