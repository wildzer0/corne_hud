[package]
name = "keyboard-hud"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Portable on-screen HUD for a Vial/QMK Corne keyboard"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = { version = "0.37", default-features = false }
# Pure Rust backends on Linux (hidraw, no libudev) and Windows; the C backend on macOS.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
lzma-rs = "0.3"
directories = "6"
log = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
# GetCursorPos, to move the window by hand (see ui::cursor_on_screen)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
deser-hjson = "2.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
